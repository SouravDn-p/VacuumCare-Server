name: Build & Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE: souravdebanth/vacuumcare-backend
  DEPLOY_PATH: /home/ec2-user/project/backend

jobs:
  # ─────────────────────────────────────────────
  # 1. BUILD & PUSH DOCKER IMAGE
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # 2. DEPLOY TO EC2 (Amazon Linux)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Write the .pem key to disk ──────────────
      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      # ── Ensure deploy directory exists on EC2 ───
      - name: Create deploy directory on EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i key.pem \
              ec2-user@${{ secrets.EC2_HOST }} \
              "mkdir -p ${{ env.DEPLOY_PATH }}"

      # ── Transfer .env and docker-compose.yaml ───
      - name: SCP .env to EC2
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          scp -o StrictHostKeyChecking=no \
              -i key.pem \
              .env \
              ec2-user@${{ secrets.EC2_HOST }}:${{ env.DEPLOY_PATH }}/.env

      - name: SCP docker-compose.yaml to EC2
        run: |
          scp -o StrictHostKeyChecking=no \
              -i key.pem \
              docker-compose.yaml \
              ec2-user@${{ secrets.EC2_HOST }}:${{ env.DEPLOY_PATH }}/docker-compose.yaml

      # ── Install Docker Compose v2 plugin if missing (Amazon Linux) ──
      - name: Ensure Docker & Compose v2 on EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i key.pem \
              ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            # ── Install Docker if not present (Amazon Linux 2023) ──────────
            if ! command -v docker &>/dev/null; then
              echo ">>> Installing Docker"
              sudo dnf install -y docker
              sudo systemctl enable --now docker
              sudo usermod -aG docker ec2-user
            fi

            # ── Install Docker Compose v2 plugin if not present ────────────
            if ! docker compose version &>/dev/null; then
              echo ">>> Installing Docker Compose v2 plugin"
              COMPOSE_VERSION=$(curl -fsSL https://api.github.com/repos/docker/compose/releases/latest \
                | grep '"tag_name"' | cut -d'"' -f4)
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -fsSL \
                "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-$(uname -m)" \
                -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            echo ">>> Docker version:"  && docker --version
            echo ">>> Compose version:" && docker compose version
          EOF

      # ── Remove stale compose file & pull image ──
      - name: Pull image & bring up containers
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i key.pem \
              ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd ${{ env.DEPLOY_PATH }}

            # Remove old docker-compose.yml so only docker-compose.yaml is used
            rm -f docker-compose.yml

            echo ">>> Logging in to Docker Hub"
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo ">>> Pulling latest image"
            docker pull ${{ env.IMAGE }}:latest

            echo ">>> Stopping old containers (if any)"
            docker compose -f docker-compose.yaml --env-file .env down --remove-orphans || true

            echo ">>> Starting containers"
            docker compose -f docker-compose.yaml --env-file .env up -d

            echo ">>> Pruning dangling images"
            docker image prune -f
          EOF

      # ── Tail logs to confirm healthy startup ────
      - name: Check container logs
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i key.pem \
              ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            cd ${{ env.DEPLOY_PATH }}

            echo "=== Container status ==="
            docker compose -f docker-compose.yaml --env-file .env ps

            echo ""
            echo "=== Last 50 lines of app logs ==="
            docker compose -f docker-compose.yaml --env-file .env logs --tail=50 app
          EOF

      # ── Cleanup local key ───────────────────────
      - name: Remove local SSH key
        if: always()
        run: rm -f key.pem .env
